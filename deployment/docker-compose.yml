# =============================================================================
# Docker Compose — Full Stack
# =============================================================================
version: "3.9"

services:
  # ---------- Backend API ----------
  backend:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: itd-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./data/insider_threat.db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme}
    volumes:
      - backend_data:/app/data
      - logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - itd-network

  # ---------- Frontend ----------
  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: itd-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - itd-network

  # ---------- Neo4j ----------
  neo4j:
    image: neo4j:5-community
    container_name: itd-neo4j
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - itd-network

volumes:
  backend_data:
  logs:
  neo4j_data:
  neo4j_logs:

networks:
  itd-network:
    driver: bridge
