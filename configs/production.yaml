# =============================================================================
# Production Environment Configuration
# =============================================================================

app:
  debug: false

server:
  host: "0.0.0.0"
  port: 8000
  workers: 8
  reload: false

database:
  url: "${oc.env:DATABASE_URL}"
  echo: false
  pool_size: 20
  max_overflow: 40

logging:
  level: "INFO"
  console: false
  json_format: true

neo4j:
  enabled: true
  uri: "${oc.env:NEO4J_URI}"
  user: "${oc.env:NEO4J_USER}"
  password: "${oc.env:NEO4J_PASSWORD}"
  database: "${oc.env:NEO4J_DATABASE,insiderthreat}"

cors:
  allow_origins:
    - "${oc.env:FRONTEND_URL}"
  allow_credentials: true

security:
  rate_limit:
    enabled: true
    requests_per_minute: 60
