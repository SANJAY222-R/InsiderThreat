# =============================================================================
# Logging Configuration
# =============================================================================

logging:
  level: "DEBUG"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level:<8} | {name}:{function}:{line} | {message}"
  json_format: false

  # Console output
  console:
    enabled: true
    colorize: true
    level: "DEBUG"

  # File sinks
  sinks:
    app:
      path: "logs/app/app_{time:YYYY-MM-DD}.log"
      rotation: "100 MB"
      retention: "30 days"
      level: "DEBUG"
      compression: "gz"

    api:
      path: "logs/api/api_{time:YYYY-MM-DD}.log"
      rotation: "100 MB"
      retention: "30 days"
      level: "INFO"
      compression: "gz"

    training:
      path: "logs/training/training_{time:YYYY-MM-DD}.log"
      rotation: "500 MB"
      retention: "90 days"
      level: "DEBUG"

    predictions:
      path: "logs/predictions/predictions_{time:YYYY-MM-DD}.log"
      rotation: "100 MB"
      retention: "60 days"
      level: "INFO"

    security:
      path: "logs/security/security_{time:YYYY-MM-DD}.log"
      rotation: "50 MB"
      retention: "365 days"
      level: "WARNING"

    errors:
      path: "logs/errors/errors_{time:YYYY-MM-DD}.log"
      rotation: "50 MB"
      retention: "90 days"
      level: "ERROR"

  # Correlation ID
  correlation:
    enabled: true
    header_name: "X-Correlation-ID"
