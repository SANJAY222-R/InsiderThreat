# =============================================================================
# THGNN Model Configuration
# =============================================================================

model:
  name: "THGNN"
  version: "1.0.0"

  # Architecture
  architecture:
    embedding_dim: 128
    hidden_dim: 128
    num_layers: 3
    num_heads: 8
    temporal_dim: 64
    dropout: 0.2
    activation: "elu"
    use_batch_norm: true
    use_residual: true
    pooling_type: "attention" # mean, max, attention, hierarchical
    time_encoding: "sinusoidal" # sinusoidal, learnable

  # Node types
  node_types:
    - user
    - host
    - file
    - usb
    - email
    - website
    - session
    - department

  # Edge types (src, relation, dst)
  edge_types:
    - [user, LOGIN_TO, host]
    - [user, ACCESS_FILE, file]
    - [user, INSERT_USB, usb]
    - [user, SEND_EMAIL, email]
    - [user, VISIT_WEBSITE, website]
    - [host, CONNECT_HOST, host]
    - [user, SESSION_MEMBER, session]
    - [user, BELONGS_TO, department]

training:
  epochs: 200
  batch_size: 512
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clipping: 1.0
  mixed_precision: true
  scheduler:
    type: "cosine"
    warmup_epochs: 10
    min_lr: 0.00001
  early_stopping:
    patience: 20
    min_delta: 0.001
    monitor: "val_auc_roc"
  loss_function: "focal" # bce, cross_entropy, focal, weighted
  class_weights:
    normal: 1.0
    threat: 50.0

evaluation:
  metrics:
    - auc_roc
    - auc_pr
    - f1_macro
    - precision
    - recall
    - false_positive_rate
  threshold: 0.5
